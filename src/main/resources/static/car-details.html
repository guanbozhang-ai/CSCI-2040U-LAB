<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Car Details</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .details-page {
            background-color: #f9f9f9;
            color: #333;
            min-height: calc(100vh - 70px);
        }

        .details-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .car-card {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .car-card h1 {
            margin-top: 0;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
            color: #2c3e50;
        }

        .specs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .spec-item {
            background: #fdfdfd;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 4px;
        }

        .spec-item strong {
            display: block;
            color: #7f8c8d;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .spec-item span {
            font-size: 1.2em;
            font-weight: bold;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .details-container {
                margin: 24px auto;
            }

            .car-card {
                padding: 22px;
            }

            .specs-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">GIT-IT-DONE</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="cars.html">Car List</a>
            <a href="surver.html">Smart Match</a>
            <a href="login.html" class="nav-button">Login</a>
        </div>
    </nav>

    <main class="details-page">
        <div class="details-container">
            <div class="car-card" id="carDetailsContainer">
                <h1 id="carTitle">Loading...</h1>

                <div class="specs-grid">
                    <div class="spec-item">
                        <strong>Exterior Colour</strong>
                        <span id="carExtColour">-</span>
                    </div>
                    <div class="spec-item">
                        <strong>Interior Colour</strong>
                        <span id="carIntColour">-</span>
                    </div>
                    <div class="spec-item">
                        <strong>Body Type</strong>
                        <span id="carBody">-</span>
                    </div>
                    <div class="spec-item">
                        <strong>Mileage</strong>
                        <span id="carMileage">-</span>
                    </div>
                    <div class="spec-item">
                        <strong>Horsepower</strong>
                        <span id="carHp">-</span>
                    </div>
                    <div class="spec-item">
                        <strong>Seating</strong>
                        <span id="carSeats">-</span>
                    </div>
                    <div class="spec-item">
                        <strong>Engine</strong>
                        <span id="carEngine">-</span>
                    </div>
                    <div class="spec-item">
                        <strong>Drivetrain</strong>
                        <span id="carDrivetrain">-</span>
                    </div>
                </div>

                <a href="cars.html" class="back-link">← Back to Inventory</a>
            </div>
        </div>
    </main>

    <script src="js/car-details.js"></script>

</body>

</html>
